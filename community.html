<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>神修维基 - 社区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--bg:#1a0a0a;--panel:#2a1010;--gold:#e6b020;--gold2:#ffd700;--red:#991515;--text:#fff8e0;--dim:#888;--border:#e6b02055;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;}
#loginMask{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;}
.login-box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:30px;width:90%;max-width:360px;}
.login-box h2{color:var(--gold2);text-align:center;margin-bottom:20px;letter-spacing:3px;}
.login-box input{width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:15px;}
.login-box button{width:100%;padding:11px;margin-top:10px;background:var(--red);border:1px solid var(--gold);color:var(--gold2);border-radius:6px;font-size:16px;cursor:pointer;}
.login-box .tip{text-align:center;color:var(--dim);font-size:12px;margin-top:10px;}
.login-tabs{display:flex;gap:10px;margin-bottom:15px;}
.login-tabs button{flex:1;padding:8px;background:transparent;border:1px solid var(--border);color:var(--dim);}
.login-tabs button.active{background:var(--red);color:var(--gold2);border-color:var(--gold);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:linear-gradient(90deg,var(--red),#5a0a0a);border-bottom:1px solid var(--gold);flex-shrink:0;gap:8px;}
.topbar .left{display:flex;align-items:center;gap:10px;}
.topbar .title{font-size:17px;font-weight:bold;color:var(--gold2);letter-spacing:2px;}
.topbar a{color:var(--gold2);text-decoration:none;padding:5px 10px;border:1px solid var(--gold);border-radius:5px;font-size:13px;}
.topbar button{background:transparent;border:1px solid var(--gold);color:var(--gold2);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:13px;}
.main{flex:1;display:flex;overflow:hidden;position:relative;}
.view{display:none;flex:1;flex-direction:column;overflow:hidden;}
.view.active{display:flex;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;gap:6px;}
.chat-header .group-name{font-size:15px;font-weight:bold;color:var(--gold2);}
.chat-header .online-count{font-size:12px;color:#6f6;}
.chat-header .hdr-btns{display:flex;gap:5px;}
.chat-header .hdr-btns button{background:transparent;border:1px solid var(--border);color:var(--gold2);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;}
.chat-box{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg-item{display:flex;gap:8px;align-items:flex-start;max-width:100%;}
.msg-self{flex-direction:row-reverse;}
.msg-avatar{width:38px;height:38px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:bold;flex-shrink:0;cursor:pointer;object-fit:cover;}
.msg-body{display:flex;flex-direction:column;max-width:calc(100% - 50px);}
.msg-self .msg-body{align-items:flex-end;}
.msg-name{font-size:11px;color:var(--dim);margin-bottom:2px;}
.msg-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;word-break:break-word;width:fit-content;max-width:100%;}
.msg-self .msg-box{background:#3a1515;}
.msg-image{max-width:220px;max-height:220px;border-radius:8px;cursor:pointer;display:block;}
.msg-video{max-width:220px;max-height:220px;border-radius:8px;display:block;}
.msg-audio{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer;}
.msg-system{text-align:center;color:var(--dim);font-size:12px;margin:4px 0;}
.reply-quote{border-left:3px solid var(--gold);background:rgba(230,176,32,.1);padding:4px 8px;border-radius:4px;font-size:12px;color:var(--dim);margin-bottom:3px;cursor:pointer;max-width:100%;}
.forward-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;max-width:260px;}
.forward-title{font-size:12px;color:var(--gold2);margin-bottom:4px;}
.forward-item{font-size:12px;color:var(--text);padding:2px 0;border-bottom:1px dotted var(--border);word-break:break-all;}
.fwd-sender{color:var(--gold2);margin-right:4px;}
.fwd-time{color:var(--dim);font-size:10px;}
.chat-input-area{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);padding:8px;}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.toolbar button{background:transparent;border:1px solid var(--border);color:var(--gold2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px;}
.input-row{display:flex;gap:6px;align-items:flex-end;}
.input-row textarea{flex:1;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;resize:none;font-size:15px;max-height:100px;}
.input-row button{padding:9px 16px;background:var(--red);border:1px solid var(--gold);color:var(--gold2);border-radius:6px;cursor:pointer;}
.recording{color:#f55!important;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.4;}}
.reply-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(230,176,32,.15);border-left:3px solid var(--gold);padding:5px 8px;margin-bottom:6px;font-size:12px;border-radius:4px;}
.reply-cancel{cursor:pointer;color:#f55;}
.emoji-panel{display:none;position:absolute;bottom:70px;left:8px;right:8px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:8px;max-height:200px;overflow-y:auto;z-index:50;}
.emoji-panel.show{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.emoji-item{width:100%;aspect-ratio:1;object-fit:contain;cursor:pointer;border-radius:4px;}
.msg-context-menu{position:fixed;background:#331010;border:1px solid var(--gold);border-radius:8px;z-index:200;min-width:120px;box-shadow:0 4px 20px rgba(0,0,0,.6);}
.ctx-item{padding:10px 16px;cursor:pointer;color:var(--text);font-size:14px;}
.ctx-item:hover{background:var(--red);}
.ctx-danger{color:#f55;}
.posts-feed{flex:1;overflow-y:auto;padding:12px;}
.post-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
.post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.post-avatar{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:bold;}
.post-author{font-weight:bold;color:var(--gold2);font-size:14px;}
.post-time{font-size:11px;color:var(--dim);}
.post-vis{font-size:10px;color:var(--dim);margin-left:5px;}
.post-content{margin:8px 0;word-break:break-word;white-space:pre-wrap;}
.post-img{max-width:100%;border-radius:8px;display:block;margin:6px 0;}
.post-video{max-width:100%;border-radius:8px;display:block;margin:6px 0;}
.post-actions{display:flex;gap:15px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;}
.post-actions span{cursor:pointer;color:var(--dim);}
.post-actions span.active{color:var(--gold2);}
.comments-box{margin-top:8px;}
.comment-item{padding:5px 0;border-bottom:1px dotted var(--border);font-size:13px;}
.comment-author{color:var(--gold2);margin-right:5px;}
.comment-reply-to{color:#6cf;font-size:11px;margin-right:5px;}
.comment-input{display:flex;gap:5px;margin-top:6px;}
.comment-input input{flex:1;background:#000;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px;font-size:13px;}
.comment-input button{background:var(--red);border:1px solid var(--gold);color:var(--gold2);border-radius:5px;padding:5px 10px;cursor:pointer;}
.post-composer{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;}
.post-composer textarea{width:100%;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;min-height:60px;resize:none;font-size:14px;}
.post-composer .row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap;}
.post-composer button{background:transparent;border:1px solid var(--border);color:var(--gold2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px;}
.post-composer .pub{margin-left:auto;background:var(--red);color:var(--gold2);}
.vis-sel{display:flex;gap:5px;}
.vis-sel button{font-size:12px;padding:4px 8px;}
.vis-sel button.active{background:var(--red);color:var(--gold2);border-color:var(--gold);}
.post-preview{max-width:120px;max-height:120px;border-radius:6px;margin-top:6px;}
.me-box{flex:1;overflow-y:auto;padding:20px;}
.me-card{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;text-align:center;margin-bottom:15px;}
.me-avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:36px;font-weight:bold;margin:0 auto 10px;cursor:pointer;overflow:hidden;}
.me-nick{font-size:20px;font-weight:bold;color:var(--gold2);}
.me-uid{font-size:12px;color:var(--dim);margin:4px 0;}
.me-bio{font-size:13px;color:var(--text);margin-top:8px;font-style:italic;}
.me-actions{margin-top:15px;display:flex;flex-direction:column;gap:8px;}
.me-actions button{background:var(--red);border:1px solid var(--gold);color:var(--gold2);padding:10px;border-radius:6px;cursor:pointer;}
.friends-list{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;}
.friends-list h3{color:var(--gold2);font-size:14px;margin-bottom:8px;}
.friend-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--border);cursor:pointer;}
.friend-avatar{width:32px;height:32px;border-radius:5px;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:14px;font-weight:bold;}
.friend-nick{flex:1;font-size:14px;}
.friend-msg{font-size:12px;color:var(--dim);}
.bottom-nav{display:none;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.modal-card{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;width:90%;max-width:340px;max-height:85vh;overflow-y:auto;}
.modal-card h3{color:var(--gold2);margin-bottom:12px;text-align:center;}
.modal-card .big-avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:28px;font-weight:bold;margin:0 auto 8px;overflow:hidden;}
.modal-card .nick{text-align:center;font-size:18px;font-weight:bold;color:var(--gold2);}
.modal-card .uid{text-align:center;color:var(--dim);font-size:12px;margin:3px 0 8px;}
.modal-card .bio{text-align:center;font-size:13px;color:var(--text);margin:8px 0;}
.modal-card .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.modal-card .btns button{padding:10px;border-radius:6px;cursor:pointer;font-size:15px;}
.btn-primary{background:var(--red);border:1px solid var(--gold);color:var(--gold2);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.member-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--border);}
.member-row .m-avatar{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:bold;}
.member-row .m-info{flex:1;}
.member-row .m-nick{font-size:14px;}
.member-row .m-role{font-size:11px;color:var(--gold2);}
.member-row .m-ops{display:flex;gap:4px;flex-wrap:wrap;}
.member-row .m-ops button{font-size:11px;padding:3px 7px;background:transparent;border:1px solid var(--border);color:var(--gold2);border-radius:4px;cursor:pointer;}
.group-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px dotted var(--border);cursor:pointer;}
.group-item .g-name{font-size:15px;font-weight:bold;color:var(--gold2);}
.group-item .g-meta{font-size:11px;color:var(--dim);}
.dm-mask{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:none;flex-direction:column;}
.dm-mask.show{display:flex;}
.dm-header{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--red);border-bottom:1px solid var(--gold);}
.dm-header .dm-title{color:var(--gold2);font-weight:bold;}
.dm-header button{background:transparent;border:1px solid var(--gold);color:var(--gold2);padding:5px 12px;border-radius:5px;cursor:pointer;}
.dm-box{flex:1;overflow-y:auto;padding:12px;}
.dm-input{display:flex;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--border);}
.dm-input input{flex:1;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;}
.dm-input button{padding:8px 14px;background:var(--red);border:1px solid var(--gold);color:var(--gold2);border-radius:6px;cursor:pointer;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:none;align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox.show{display:flex;}
.lightbox img{max-width:95%;max-height:95%;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--red);border:1px solid var(--gold);color:var(--gold2);padding:8px 18px;border-radius:6px;z-index:999;font-size:14px;}
@media (max-width:768px){
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--gold);z-index:100;}
  .bottom-nav button{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);font-size:12px;cursor:pointer;}
  .bottom-nav button.active{color:var(--gold2);}
  .main{padding-bottom:50px;}
  .topbar .title{font-size:15px;}
  .msg-image,.msg-video{max-width:180px;max-height:180px;}
}
</style>
</head>
<body>
<div id="loginMask">
  <div class="login-box">
    <h2>神修社区</h2>
    <div class="login-tabs">
      <button id="tabLogin" class="active" onclick="switchLoginTab('login')">登录</button>
      <button id="tabReg" onclick="switchLoginTab('reg')">注册</button>
    </div>
    <input id="loginUid" placeholder="12位数字ID" maxlength="12">
    <input id="loginNick" placeholder="昵称（注册时填）" style="display:none">
    <input id="loginPwd" type="password" placeholder="密码">
    <button onclick="doLogin()">进入社区</button>
    <div class="tip">ID为12位数字，如 999888777666</div>
  </div>
</div>
<div class="topbar">
  <div class="left">
    <a href="wiki.html">← 返回维基</a>
    <div class="title">神修维基社区</div>
  </div>
  <button onclick="logout()">退出</button>
</div>
<div class="main">
  <div class="view active" id="view-chat">
    <div class="chat-header">
      <div>
        <div class="group-name" id="curGroupName">神修维基无权</div>
        <div class="online-count">在线 <span id="onlineNum">0</span> · 总注册 <span id="totalNum">0</span></div>
      </div>
      <div class="hdr-btns">
        <button onclick="showGroups()">群列表</button>
        <button onclick="showGroupInfo()">群成员</button>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-area">
      <div class="toolbar">
        <button onclick="pickImage()">图片</button>
        <button onclick="pickVideo()">视频</button>
        <button onclick="toggleEmoji()">表情</button>
        <button id="voiceBtn" onclick="toggleVoice(this)">语音</button>
      </div>
      <div class="emoji-panel" id="emojiPanel"></div>
      <div class="input-row">
        <textarea id="msgText" rows="1" placeholder="输入消息..."></textarea>
        <button onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>
  <div class="view" id="view-posts">
    <div class="chat-header"><div class="group-name">社区动态</div></div>
    <div class="posts-feed" id="postsFeed">
      <div class="post-composer">
        <textarea id="postText" placeholder="分享你的想法..."></textarea>
        <div class="row">
          <button onclick="pickPostImage()">图片</button>
          <button onclick="pickPostVideo()">视频</button>
          <div class="vis-sel">
            <button class="active" data-v="public" onclick="setVis(this)">公开</button>
            <button data-v="friends" onclick="setVis(this)">仅好友</button>
            <button data-v="private" onclick="setVis(this)">仅自己</button>
          </div>
          <img id="postPreview" class="post-preview" style="display:none">
          <button class="pub" onclick="publishPost()">发布</button>
        </div>
      </div>
      <div id="postList"></div>
    </div>
  </div>
  <div class="view" id="view-me">
    <div class="chat-header"><div class="group-name">我的主页</div></div>
    <div class="me-box">
      <div class="me-card">
        <div class="me-avatar" id="meAvatar" onclick="pickAvatar()">?</div>
        <div class="me-nick" id="meNick">未登录</div>
        <div class="me-uid" id="meUid"></div>
        <div class="me-bio" id="meBio">这个人很懒，什么都没写</div>
        <div class="me-actions">
          <button onclick="changeNick()">改昵称</button>
          <button onclick="changeBio()">改签名</button>
          <button onclick="createGroupDialog()">创建新群</button>
        </div>
      </div>
      <div class="friends-list">
        <h3>我的好友</h3>
        <div id="friendsList"><div style="color:var(--dim);font-size:13px">暂无好友</div></div>
      </div>
    </div>
  </div>
</div>
<div class="bottom-nav">
  <button class="active" data-view="chat" onclick="switchView('chat',this)">聊天</button>
  <button data-view="posts" onclick="switchView('posts',this)">动态</button>
  <button data-view="me" onclick="switchView('me',this)">我的</button>
</div>
<input type="file" id="fileImage" accept="image/*" style="display:none">
<input type="file" id="fileVideo" accept="video/*" style="display:none">
<input type="file" id="filePostImage" accept="image/*" style="display:none">
<input type="file" id="filePostVideo" accept="video/*" style="display:none">
<input type="file" id="fileAvatar" accept="image/*" style="display:none">
<div class="modal-mask" id="groupListModal">
  <div class="modal-card">
    <h3>群列表</h3>
    <div id="groupListBox"></div>
    <div class="btns"><button class="btn-ghost" onclick="closeModal('groupListModal')">关闭</button></div>
  </div>
</div>
<div class="modal-mask" id="groupInfoModal">
  <div class="modal-card">
    <h3 id="groupInfoTitle">群成员</h3>
    <div id="groupMembersBox"></div>
    <div class="btns"><button class="btn-ghost" onclick="closeModal('groupInfoModal')">关闭</button></div>
  </div>
</div>
<div class="modal-mask" id="profileModal">
  <div class="modal-card" onclick="if(event.target===this)closeModal('profileModal')">
    <div class="big-avatar" id="pAvatar">?</div>
    <div class="nick" id="pNick">?</div>
    <div class="uid" id="pUid"></div>
    <div class="bio" id="pBio"></div>
    <div class="btns">
      <button class="btn-primary" onclick="addFriend()">加好友</button>
      <button class="btn-primary" onclick="openDM()">发私信</button>
      <button class="btn-ghost" onclick="closeModal('profileModal')">关闭</button>
    </div>
  </div>
</div>
<div class="dm-mask" id="dmMask">
  <div class="dm-header">
    <div class="dm-title" id="dmTitle">私聊</div>
    <button onclick="closeDM()">关闭</button>
  </div>
  <div class="dm-box" id="dmBox"></div>
  <div class="dm-input">
    <input id="dmText" placeholder="输入私信...">
    <button onclick="sendDM()">发送</button>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"></div>
<script>
const $=id=>document.getElementById(id);
let currentUser=null,ws=null,msgHistory=[],allUsers=[],onlineUsers=[],emojis=[];
let currentGroupId='default',currentProfileUid=null,dmPartner=null,dmHistory=[];
let pendingPostMedia=null,pendingReply=null,postVis='public';
let mediaRecorder=null,audioChunks=[],isRecording=false;
let myGroups=[];

function switchLoginTab(t){
  $('tabLogin').classList.toggle('active',t==='login');
  $('tabReg').classList.toggle('active',t==='reg');
  $('loginNick').style.display=t==='reg'?'block':'none';
}
async function doLogin(){
  const uid=$('loginUid').value.trim(),pwd=$('loginPwd').value;
  const isReg=$('tabReg').classList.contains('active');
  if(isReg){
    const nick=$('loginNick').value.trim();
    if(!nick){toast('请填昵称');return;}
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid,nick,password:pwd})}).then(r=>r.json());
    if(!r.ok){toast(r.msg);return;}

function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>ws.send(JSON.stringify({type:'auth',uid:currentUser.uid,nick:currentUser.nick}));
  ws.onmessage=e=>{
    let msg;try{msg=JSON.parse(e.data);}catch(err){return;}
    if(msg.type==='history'){msgHistory=msg.data||[];renderMsgs();}
    else if(msg.type==='online'){onlineUsers=msg.data||[];$('onlineNum').textContent=onlineUsers.length;refreshTotal();}
    else if(msg.type==='chat'){if(msg.data.gid===currentGroupId){msgHistory.push(msg.data);appendMsg(msg.data);scrollChatBottom();}}
    else if(msg.type==='system'){if(msg.data.gid===currentGroupId||!msg.data.gid){const d=document.createElement('div');d.className='msg-system';d.textContent=msg.data.content;$('chatBox').appendChild(d);scrollChatBottom();}}
    else if(msg.type==='delete'){msgHistory=msgHistory.filter(x=>x.id!==msg.data.id);const el=document.querySelector(`[data-msg-id="${msg.data.id}"]`);if(el)el.remove();}
    else if(msg.type==='profile-updated'){allUsers=allUsers.map(u=>u.uid===msg.data.uid?{...u,...msg.data}:u);}
    else if(msg.type==='dm'){handleDM(msg.data);}
    else if(msg.type==='post-new'){prependPost(msg.data);}
    else if(msg.type==='post-comment'){loadPosts();}
    else if(msg.type==='kicked'){toast('你被移出了该群');joinGroup('default');}
    else if(msg.type==='error'){toast(msg.data.msg);}
  };
  ws.onclose=()=>setTimeout(connectWS,2000);
}

function appendMsg(m){

  let replyHtml='';
  if(m.replyTo){
    let prev=m.replyTo.type==='image'?'[图片]':m.replyTo.type==='video'?'[视频]':m.replyTo.type==='audio'?'[语音]':(m.replyTo.content||'');
    if(prev.length>60)prev=prev.slice(0,60)+'...';
    replyHtml=`<div class="reply-quote" onclick="jumpToMsg('${m.id}')"><b style="color:var(--gold2)">${escapeHtml(m.replyTo.sender||'?')}</b>:${escapeHtml(prev)}</div>`;
  }

  else if(m.type==='video')body=`<video class="msg-video" src="${m.content}" controls></video>`;
  else if(m.type==='audio')body=`<div class="msg-audio" onclick="playAudio(this,'${m.content}')">▶ 语音</div>`;

  }
  else body=`<div class="msg-box">${escapeHtml(m.content)}</div>`;
  div.innerHTML=`${av}<div class="msg-body"><div class="msg-name">${escapeHtml(m.sender)} · ${fmtTime(m.time)}</div>${replyHtml}${body}</div>`;

function fmtTime(t){const d=new Date(t);return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bindCtxMenu(div,m){
  let timer;
  const show=(x,y)=>openCtxMenu(x,y,m);
  div.addEventListener('touchstart',e=>{timer=setTimeout(()=>{const t=e.touches[0];show(t.clientX,t.clientY);},500);},{passive:true});
  div.addEventListener('touchend',()=>clearTimeout(timer));
  div.addEventListener('touchmove',()=>clearTimeout(timer));
  div.addEventListener('contextmenu',e=>{e.preventDefault();show(e.clientX,e.clientY);});
}
function openCtxMenu(x,y,m){
  closeCtxMenu();
  const menu=document.createElement('div');menu.className='msg-context-menu';menu.id='ctxMenu';
  let html=`<div class="ctx-item" data-a="reply">回复</div><div class="ctx-item" data-a="forward">转发</div>`;
  if(m.senderId===currentUser.uid)html+=`<div class="ctx-item ctx-danger" data-a="delete">撤回</div>`;
  menu.innerHTML=html;document.body.appendChild(menu);
  const mw=menu.offsetWidth,mh=menu.offsetHeight;
  menu.style.left=Math.min(x,window.innerWidth-mw-10)+'px';
  menu.style.top=Math.min(y,window.innerHeight-mh-10)+'px';
  menu.querySelectorAll('.ctx-item').forEach(it=>{
    it.onclick=()=>{const act=it.dataset.a;closeCtxMenu();
      if(act==='reply')startReply(m);
      else if(act==='delete')doDelete(m);
      else if(act==='forward')forwardDialog(m);
    };
  });
  setTimeout(()=>{const close=e=>{if(!menu.contains(e.target)){closeCtxMenu();document.removeEventListener('click',close);}};document.addEventListener('click',close);},0);
}

function forwardDialog(m){

    <div class="btns"><button class="btn-primary" id="fwdSingle">逐条转发</button><button class="btn-primary" id="fwdMerge">合并为聊天记录</button><button class="btn-ghost" id="fwdCancel">取消</button></div></div>`;

async function toggleVoice(btn){
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const reader=new FileReader();
        reader.onload=async()=>{
          const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:reader.result,mime:'audio/webm'})}).then(r=>r.json());
          if(r.ok)ws.send(JSON.stringify({type:'chat',data:{gid:currentGroupId,type:'audio',content:r.url}}));
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();isRecording=true;btn.classList.add('recording');btn.textContent='停止';
    }catch(e){toast('无法录音:'+e.message);}
  }else{
    mediaRecorder.stop();isRecording=false;btn.classList.remove('recording');btn.textContent='语音';
  }
}

$('filePostVideo').onchange=e=>{pendingPostMedia={file:e.target.files[0],type:'video'};showPostPreview();};
function showPostPreview(){
  const img=$('postPreview');
  if(pendingPostMedia&&pendingPostMedia.type==='image'){img.src=URL.createObjectURL(pendingPostMedia.file);img.style.display='block';}
  else img.style.display='none';
}
async function publishPost(){
  const text=$('postText').value.trim();
  if(!text&&!pendingPostMedia){toast('写点什么或选个媒体');return;}
  let content=text,type='text';
  if(pendingPostMedia){
    const r=await new Promise(res=>{const reader=new FileReader();reader.onload=async()=>{const up=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:reader.result,mime:pendingPostMedia.file.type})}).then(r=>r.json());res(up);};reader.readAsDataURL(pendingPostMedia.file);});
    if(!r.ok){toast(r.msg);return;}
    content=r.url;type=pendingPostMedia.type;
  }
  await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:currentUser.uid,type,content,visibility:postVis})});
  $('postText').value='';pendingPostMedia=null;$('postPreview').style.display='none';
  toast('动态已发布');
}
function openLightbox(src){const lb=$('lightbox');lb.innerHTML=`<img src="${src}">`;lb.classList.add('show');}
function toast(msg){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
$('dmText').addEventListener('keydown',e=>{if(e.key==='Enter')sendDM();});

// ===== 群系统 =====
async function showGroups(){
  const r=await fetch('/api/groups?uid='+currentUser.uid).then(r=>r.json());
  if(!r.ok){toast('加载失败');return;}
  myGroups=r.list;
  $('groupListBox').innerHTML=r.list.map(g=>`
    <div class="group-item" onclick="switchGroup('${g.id}')">
      <div>
        <div class="g-name">${escapeHtml(g.name)}</div>
        <div class="g-meta">${g.memberCount}人 · ${g.myRole==='owner'?'群主':g.myRole==='admin'?'管理员':'成员'}</div>
      </div>
      <div style="color:var(--gold2)">→</div>
    </div>`).join('')+`<div class="btns"><button class="btn-primary" onclick="createGroupDialog()">创建新群</button></div>`;
  $('groupListModal').classList.add('show');
}
function createGroupDialog(){
  const name=prompt('输入新群名称');if(!name)return;
  fetch('/api/group/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:currentUser.uid,name})}).then(r=>r.json()).then(r=>{
    if(r.ok){toast('群已创建');closeModal('groupListModal');switchGroup(r.group.id);}
    else toast(r.msg);
  });
}
async function switchGroup(gid){
  closeModal('groupListModal');
  currentGroupId=gid;
  const g=myGroups.find(x=>x.id===gid)||{};
  $('curGroupName').textContent=g.name||'群聊';
  ws.send(JSON.stringify({type:'join',data:{gid}}));
}
async function showGroupInfo(){
  const r=await fetch(`/api/group/members/${currentGroupId}`).then(r=>r.json());
  if(!r.ok){toast('加载失败');return;}
  $('groupInfoTitle').textContent='群成员 ('+r.members.length+')';
  const meMember = r.members.find(m=>m.uid===currentUser.uid);
  const myRole = meMember?meMember.role:'member';
  $('groupMembersBox').innerHTML=r.members.map(m=>{
    let ops='';
    if(m.uid!==currentUser.uid){
      const canKick = myRole==='owner' || (myRole==='admin' && m.role==='member');
      const canMute = myRole==='owner' || (myRole==='admin' && m.role!=='admin');
      const canSetAdmin = myRole==='owner';
      if(canKick)ops+=`<button onclick="kickMember('${m.uid}')">踢</button>`;
      if(canSetAdmin)ops+=`<button onclick="setAdmin('${m.uid}',${m.role==='admin'?'false':'true'})">${m.role==='admin'?'取消管理':'设管理'}</button>`;
      if(canMute)ops+=`<button onclick="muteMember('${m.uid}')">禁言</button>`;
    }
    return `<div class="member-row">
      <div class="m-avatar">${m.avatar?`<img src="${m.avatar}" style="width:100%;height:100%;object-fit:cover">`:escapeHtml(m.nick.charAt(0))}</div>
      <div class="m-info"><div class="m-nick">${escapeHtml(m.nick)} ${m.muted?`<span style="color:#f55">(禁言${m.muted}s)</span>`:''}</div><div class="m-role">${m.role==='owner'?'群主':m.role==='admin'?'管理员':'成员'}</div></div>
      <div class="m-ops">${ops}</div>
    </div>`;
  }).join('');
  $('groupInfoModal').classList.add('show');
}
function kickMember(uid){if(!confirm('确定踢出该成员？'))return;ws.send(JSON.stringify({type:'kick',data:{gid:currentGroupId,targetUid:uid}}));toast('已踢出');setTimeout(showGroupInfo,500);}
function setAdmin(uid,add){ws.send(JSON.stringify({type:'setAdmin',data:{gid:currentGroupId,targetUid:uid,add:add}}));toast('操作成功');setTimeout(showGroupInfo,500);}
function muteMember(uid){
  const sec=prompt('禁言秒数（0=解除）','60');
  if(sec===null)return;
  ws.send(JSON.stringify({type:'mute',data:{gid:currentGroupId,targetUid:uid,seconds:Number(sec)||0}}));
  toast('操作成功');setTimeout(showGroupInfo,500);
}

autologin();
