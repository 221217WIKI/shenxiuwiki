<title>神修维基 - 喷神人物档案</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(135deg, #991515 0%, #e6b020 100%);
    background-attachment: fixed;
    color:#3a2410;
    font-family:"Microsoft Yahei",sans-serif;
    padding:24px;
}

.container{
    max-width:1300px;
    margin:0 auto;
}

/* 顶部标题栏 */
.header{
    background: linear-gradient(135deg, #b00020 0%, #f5a623 100%);
    padding:18px 24px;
    border:2px solid;
    border-color:#ffd24d #7a2412 #7a2412 #ffd24d;
    border-radius:12px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 0 18px rgba(255,170,0,0.45);
}

.header h1{
    font-size:24px;
    letter-spacing:2px;
    color:#fff8e0;
}

.back-link{
    color:#fff8e0;
    text-decoration:none;
    border:1px solid #fff8e0;
    padding:6px 12px;
    border-radius:6px;
    font-weight:bold;
}

.back-link:hover{
    background:rgba(255,248,224,0.2);
}

/* 搜索区 */
.search-area{
    margin-bottom:20px;
    display:flex;
    gap:10px;
    align-items:center;
}

#searchInput{
    flex:1;
    max-width:500px;
    padding:10px 14px;
    border:2px solid;
    border-color:#ffd24d #b00020 #b00020 #ffd24d;
    background:#fff8e0;
    color:#3a2410;
    font-size:14px;
    outline:none;
    border-radius:8px;
}

#searchInput:focus{
    box-shadow:0 0 10px rgba(255,210,77,0.6);
}

/* 复古凸起按钮 */
.qq-btn{
    border:2px solid;
    border-color:#fff #7a2412 #7a2412 #fff;
    background: linear-gradient(180deg, #ffd24d 0%, #b00020 100%);
    color:#fff8e0;
    padding:8px 16px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    border-radius:8px;
}

.qq-btn:hover{
    box-shadow:0 0 12px rgba(255,170,0,0.5);
}

.qq-btn:active{
    border-color:#7a2412 #fff #fff #7a2412;
}

/* 人物卡片网格 */
.card-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
}

.card-item{
    background: linear-gradient(160deg, #fff4c4 0%, #ffd24d 45%, #f5a623 100%);
    border:2px solid;
    border-color:#ffd24d #b00020 #b00020 #ffd24d;
    padding:18px;
    border-radius:12px;
    transition:0.25s;
    box-shadow:0 0 10px rgba(255,170,0,0.35);
    text-align:center;
}

.card-item:hover{
    transform:translateY(-4px);
    box-shadow:0 0 18px rgba(255,140,0,0.65);
    border-color:#fff4c4 #7a2412 #7a2412 #fff4c4;
}

/* 头像 */
.card-avatar{
    width:80px;
    height:80px;
    margin:0 auto 12px;
    border-radius:50%;
    border:3px solid #b00020;
    background:#fff4c4;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 12px rgba(255,210,77,0.7);
}

.card-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-avatar .avatar-text{
    font-size:30px;
    font-weight:bold;
    color:#b00020;
}

.card-name{
    font-size:20px;
    color:#7a2412;
    font-weight:bold;
    margin-bottom:10px;
    border-bottom:1px solid #b00020;
    padding-bottom:6px;
}

.card-desc{
    font-size:14px;
    line-height:1.6;
    color:#3a2410;
    text-align:left;
}

.card-tag{
    display:inline-block;
    margin-top:12px;
    font-size:12px;
    padding:4px 10px;
    background: linear-gradient(135deg, #b00020 0%, #7a2412 100%);
    color:#fff4c4;
    border-radius:20px;
    font-weight:bold;
    border:1px solid #ffd24d;
}

/* 分页 */
.page-box{
    margin-top:30px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

.page-tip{
    text-align:center;
    margin:16px 0;
    color:#fff8e0;
    font-weight:bold;
}

@media(max-width:700px){
    .card-wrap{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

// 分页逻辑
const pageSize = 12;
let currentPage = 1;
let filterList = [...personList];

function render(){
    const totalPage = Math.max(1, Math.ceil(filterList.length / pageSize));
    const start = (currentPage - 1) * pageSize;
    const pageData = filterList.slice(start, start + pageSize);
    const container = document.getElementById("cardContainer");
    container.innerHTML = "";

    pageData.forEach(item=>{
        const card = document.createElement("div");
        card.className = "card-item";

        // 头像：有图片就显示图片，没有就显示名字首字
        const avatarHtml = item.avatar
            ? `<div class="card-avatar"><img src="${item.avatar}" alt="${item.name}"></div>`
            : `<div class="card-avatar"><span class="avatar-text">${item.name.charAt(0)}</span></div>`;

        card.innerHTML = `
            ${avatarHtml}
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-tag">${item.tag}</div>
        `;
        container.appendChild(card);
    });

    document.getElementById("pageTip").innerText = `共${filterList.length}条档案，第${currentPage}/${totalPage}页`;
    renderPageBtn(totalPage);
}

function renderPageBtn(totalPage){
    const box = document.getElementById("pageBox");
    box.innerHTML = "";

    for(let i = 1; i <= totalPage; i++){
        const btn = document.createElement("button");
        btn.className = "qq-btn";
        if(i === currentPage){
            btn.style.background = "linear-gradient(180deg, #fff4c4 0%, #ffd24d 50%, #f5a623 100%)";
            btn.style.color = "#7a2412";
            btn.style.borderColor = "#b00020";
        }
        btn.innerText = i;
        btn.onclick = ()=>{
            currentPage = i;
            render();
        };
        box.appendChild(btn);
    }
}

// 搜索
function doSearch(){
    const kw = document.getElementById("searchInput").value.trim().toLowerCase();
    filterList = personList.filter(p=>
        p.name.toLowerCase().includes(kw) ||
        p.desc.toLowerCase().includes(kw) ||
        p.tag.toLowerCase().includes(kw)
    );
    currentPage = 1;
    render();
}

document.getElementById("searchBtn").onclick = doSearch;
document.getElementById("searchInput").addEventListener("keydown", e=>{
    if(e.key === "Enter") doSearch();
});

render();
</script>
